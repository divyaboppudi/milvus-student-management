[project]
name = "milvus-student-management"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dependency-injector>=4.49.1",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pymilvus>=3.0.1",
    "rich>=15.0.0",
    "sentence-transformers>=6.0.1",
    "typer>=0.27.2",
    "uvicorn>=0.52.4",
]

[project.scripts]
milvus-student-management = "milvus_student_management:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
